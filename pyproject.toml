[project]
name = "petri"
version = "0.2.0"
description = "Petri: cells that live, compete and evolve on a grid, and think through their encounters with a small model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
petri = "petri.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petri"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the model's prompt reads better in whole lines
"src/petri/mind.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
